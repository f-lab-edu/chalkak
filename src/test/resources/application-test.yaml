cors:
  allowed-origins: http://localhost:3000

file:
  upload-dir: build/test-uploads

spring:
  datasource:
    url: jdbc:h2:mem:chalkak;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

logging:
  level:
    com.chalkak: debug
