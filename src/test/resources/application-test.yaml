cors:
  allowed-origins: http://localhost:3000

file:
  upload-dir: build/test-uploads

spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///chalkak
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  test:
    database:
      replace: none
  cloud:
    aws:
      sqs:
        enabled: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

logging:
  level:
    com.chalkak: debug
