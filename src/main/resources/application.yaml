spring:
  application:
    name: chalkak
  profiles:
    active: local
  task:
    scheduling:
      pool:
        size: 3

scheduler:
  auction-close:
    fixed-delay: 60000
  outbox-relay:
    enabled: true
    fixed-delay: ${OUTBOX_RELAY_FIXED_DELAY:100}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    tags:
      application: ${spring.application.name}

sqs:
  queue:
    bid: bid-queue.fifo
    bid-dlq: bid-dlq.fifo
    # 큐 생성 시 쓰는 값과 같아야 한다 (.env BID_QUEUE_MAX_RECEIVE_COUNT, 의미는 .env.example 참고)
    bid-max-receive-count: ${BID_QUEUE_MAX_RECEIVE_COUNT:3}

sse:
  heartbeat-interval: 30000
