spring:
  application:
    name: chalkak
  profiles:
    active: local

scheduler:
  auction-close:
    fixed-delay: 60000

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    tags:
      application: ${spring.application.name}

sqs:
  queue:
    bid: bid-queue.fifo

sse:
  heartbeat-interval: 30000
