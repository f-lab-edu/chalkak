server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

cors:
  allowed-origins: http://localhost:3000

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: ${SQS_ENDPOINT}


logging:
  level:
    com.chalkak: warn
    com.chalkak.loadtest: info
    # 큐 메시지 삭제(ack) 완료 시각을 남긴다. "Done acknowledging ... messages: [MessageId] in {}ms"
    io.awspring.cloud.sqs.listener.acknowledgement.SqsAcknowledgementExecutor: trace
