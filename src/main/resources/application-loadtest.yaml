server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

cors:
  allowed-origins: http://localhost:8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

logging:
  level:
    com.chalkak: warn
