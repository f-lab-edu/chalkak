services:
  postgres:
    image: postgres:16-alpine
    container_name: chalkak-postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chalkak}
      POSTGRES_USER: ${POSTGRES_USER:-chalkak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chalkak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chalkak} -d ${POSTGRES_DB:-chalkak}"]
      interval: 5s
      timeout: 5s
      retries: 5
  localstack:
    image: localstack/localstack:2026.03.0
    container_name: chalkak-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN is required}
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-northeast-2
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
