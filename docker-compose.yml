services:
  postgres:
    image: postgres:16-alpine
    container_name: chalkak-postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chalkak}
      POSTGRES_USER: ${POSTGRES_USER:-chalkak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chalkak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chalkak} -d ${POSTGRES_DB:-chalkak}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
